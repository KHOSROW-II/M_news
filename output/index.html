<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live News Monitor</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px}
.container{max-width:1200px;margin:0 auto;background:white;border-radius:10px}
.header{background:#1a1a2e;color:white;padding:20px;text-align:center}
.header h1{margin:0}
.timebar{background:#2d3748;color:#e2e8f0;text-align:center;padding:10px}
.section{padding:20px}
.section h2{color:#333;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
.card{background:#f9f9f9;border-radius:8px;padding:15px;border:1px solid #ddd}
.card-source{color:#667eea;font-weight:bold;font-size:12px}
.card-title{margin:10px 0}
.card-title a{color:#333;text-decoration:none}
.card-title a:hover{color:#667eea}
.card-time{color:#999;font-size:11px;text-align:right}
.footer{background:#2d3748;color:#a0aec0;text-align:center;padding:15px;font-size:12px}
@media (max-width:600px){body{padding:10px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>📡 Live News Aggregator</h1><p>Real-time headlines from global media</p></div>
<div class="timebar" id="timestamp">Loading...</div>
<div class="section"><h2>🌐 News Websites</h2><div class="grid" id="websites-news"></div></div>
<div class="section"><h2>📱 Telegram Channels</h2><div class="grid" id="telegram-news"></div></div>
<div class="footer">Powered by GitHub Actions | Updates every 20 minutes</div>
</div>
<script src="data.js"></script>
<script>
function createCard(s,t,l,time){
  var safeTitle = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<div class="card"><div class="card-source">📰 '+s+'</div><div class="card-title"><a href="'+l+'" target="_blank">'+safeTitle+'</a></div><div class="card-time">🕐 '+time+'</div></div>';
}
var wsDiv=document.getElementById('websites-news');
if(wsDiv&&window.websiteData&&window.websiteData.length){
  var html='';
  for(var i=0;i<window.websiteData.length;i++) html+=createCard(window.websiteData[i].source,window.websiteData[i].title,window.websiteData[i].link,window.websiteData[i].time);
  wsDiv.innerHTML=html;
}
var tgDiv=document.getElementById('telegram-news');
if(tgDiv&&window.telegramData&&window.telegramData.length){
  var html='';
  for(var i=0;i<window.telegramData.length;i++) html+=createCard(window.telegramData[i].source,window.telegramData[i].title,window.telegramData[i].link,window.telegramData[i].time);
  tgDiv.innerHTML=html;
}
document.getElementById('timestamp').innerHTML='🔄 Last updated: '+new Date().toLocaleString();
</script>
</body>
</html>
