name: Live News Aggregator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p output

      - name: Fetch website headlines
        id: fetch_websites
        run: |
          get_title() {
            url="$1"
            curl -s -L --max-time 15 --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" "$url" | grep -i -m1 '<title>' | sed 's/<[^>]*>//g' | sed 's/&nbsp;/ /g' | sed 's/&[a-z]*;//g' | cut -c1-120
          }

          echo '[' > websites.json
          first=true

          sites="Axios|https://axios.com
          Fox News|https://foxnews.com
          ABC News|https://abcnews.go.com
          CBS News|https://cbsnews.com
          The Jerusalem Post|https://jpost.com
          Israel Hayom|https://israelhayom.com
          Channel 14 Israel|https://now14.co.il
          Army Radio Israel|https://glz.co.il
          Iran International|https://iranintl.com"

          while IFS='|' read -r name url; do
            echo "Fetching: $name"
            title=$(get_title "$url")
            if [ -n "$title" ] && [ "$title" != "Just a moment..." ]; then
              if [ "$first" = true ]; then first=false; else echo ',' >> websites.json; fi
              echo "{\"source\":\"$name\",\"title\":\"$title\",\"link\":\"$url\",\"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\"}" >> websites.json
            fi
            sleep 1
          done <<< "$sites"
          echo ']' >> websites.json

      - name: Fetch Telegram channels
        id: fetch_telegram
        run: |
          get_telegram() {
            channel="$1"
            channel_clean="${channel#@}"
            api_url="https://tg.i-c-a.su/json/${channel_clean}/last"
            response=$(curl -s --max-time 10 "$api_url")
            text=$(echo "$response" | jq -r '.text // .caption // "No content available"' | head -c 250 | sed 's/\n/ /g')
            link="https://t.me/${channel_clean}"
            echo "{\"source\":\"$channel\",\"title\":\"$text\",\"link\":\"$link\",\"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\"}"
          }

          echo '[' > telegram.json
          first=true

          for ch in "@VahidOnline" "@alonews" "@IranintlTV"; do
            echo "Fetching: $ch"
            post=$(get_telegram "$ch")
            if [ -n "$post" ] && [ "$post" != "null" ]; then
              if [ "$first" = true ]; then first=false; else echo ',' >> telegram.json; fi
              echo "$post" >> telegram.json
            fi
            sleep 1
          done
          echo ']' >> telegram.json

      - name: Build HTML page
        run: |
          cat > output/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live News Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
        }
        .timestamp-bar {
            background: #2d3748;
            color: #e2e8f0;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-family: monospace;
        }
        .section {
            padding: 30px;
            border-bottom: 1px solid #e2e8f0;
        }
        .section:last-child {
            border-bottom: none;
        }
        .section h2 {
            color: #2d3748;
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: #f7fafc;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background: white;
        }
        .card-source {
            font-weight: bold;
            color: #667eea;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .card-title {
            font-size: 1rem;
            line-height: 1.5;
            margin: 12px 0;
        }
        .card-title a {
            color: #2d3748;
            text-decoration: none;
        }
        .card-title a:hover {
            color: #667eea;
            text-decoration: underline;
        }
        .card-time {
            font-size: 0.7rem;
            color: #a0aec0;
            margin-top: 10px;
            text-align: right;
            font-family: monospace;
        }
        .footer {
            background: #2d3748;
            color: #a0aec0;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .section { padding: 20px; }
            .news-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📡 Live News Aggregator</h1>
        <p>Real-time headlines from global media & Telegram channels</p>
    </div>
    <div class="timestamp-bar" id="timestamp">
        Loading...
    </div>

    <div class="section">
        <h2>🌐 News Websites</h2>
        <div class="news-grid" id="websites-news"></div>
    </div>

    <div class="section">
        <h2>📱 Telegram Channels</h2>
        <div class="news-grid" id="telegram-news"></div>
    </div>

    <div class="footer">
        Generated by GitHub Actions | Updates every 20 minutes
    </div>
</div>

<script>
    function createCard(source, title, link, time) {
        return `
            <div class="card">
                <div class="card-source">📰 ${source}</div>
                <div class="card-title">
                    <a href="${link}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a>
                </div>
                <div class="card-time">🕐 ${time}</div>
            </div>
        `;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    const websiteData = __WEBSITES_JSON__;
    const telegramData = __TELEGRAM_JSON__;

    const websiteContainer = document.getElementById('websites-news');
    if (websiteContainer && websiteData && websiteData.length) {
        websiteContainer.innerHTML = websiteData.map(item => createCard(item.source, item.title, item.link, item.time)).join('');
    }

    const telegramContainer = document.getElementById('telegram-news');
    if (telegramContainer && telegramData && telegramData.length) {
        telegramContainer.innerHTML = telegramData.map(item => createCard(item.source, item.title, item.link, item.time)).join('');
    }

    const timestampDiv = document.getElementById('timestamp');
    if (timestampDiv) {
        timestampDiv.innerHTML = `🔄 Last updated: ${new Date().toLocaleString('en-US')} UTC`;
    }
</script>
</body>
</html>
HTMLEOF

      - name: Inject JSON data into HTML
        run: |
          WEBSITES_JSON=$(cat websites.json | jq -c '.')
          TELEGRAM_JSON=$(cat telegram.json | jq -c '.')
          sed -i "s|__WEBSITES_JSON__|$WEBSITES_JSON|g" output/index.html
          sed -i "s|__TELEGRAM_JSON__|$TELEGRAM_JSON|g" output/index.html
          rm websites.json telegram.json

      - name: Save as MHTML
        run: cp output/index.html output/news.mhtml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-aggregator
          path: output/
          retention-days: 7

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/news.mhtml output/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto-update news [skip ci]" && git push
        continue-on-error: true
