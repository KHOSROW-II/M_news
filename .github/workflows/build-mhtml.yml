name: Build News MHTML

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Debug - Show files before install
        run: |
          echo "=== Listing files before install ==="
          ls -la
          echo "=== Current directory ==="
          pwd
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "=== Installed packages ==="
          pip list
      
      - name: Debug - Show files after install
        run: |
          echo "=== Listing files after install ==="
          ls -la
          echo "=== Python version ==="
          python --version
      
      - name: Create output directory
        run: mkdir -p output backups
      
      - name: Run scraper
        id: scraper
        run: |
          echo "=== Running scraper.py ==="
          python scraper.py
          echo "=== Exit code: $? ==="
      
      - name: Check if files were created
        run: |
          echo "=== Checking output directory ==="
          ls -la output/ || echo "output directory is empty"
          echo "=== Checking for MHTML file ==="
          if [ -f "output/news.mhtml" ]; then
            echo "✅ MHTML file exists!"
            echo "File size:"
            ls -lh output/news.mhtml
          else
            echo "❌ MHTML file not found!"
            echo "Creating emergency file..."
            echo "<html><body><h1>Error</h1><p>Scraper failed</p></body></html>" > output/news.mhtml
          fi
      
      - name: Debug - Show content of index.html (first 10 lines)
        if: always()
        run: |
          if [ -f "output/index.html" ]; then
            echo "=== First 10 lines of index.html ==="
            head -10 output/index.html
          else
            echo "index.html not found"
          fi
      
      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-output
          path: |
            output/
            backups/
          retention-days: 7
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/news.mhtml output/index.html backups/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update news MHTML [skip ci]"
            git push
            echo "✅ Changes pushed successfully"
          fi
        continue-on-error: true
