name: Build News

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create HTML
        run: |
          mkdir -p output
          echo "<html><body><h1>News</h1><p>Test</p></body></html>" > output/index.html
          cp output/index.html output/news.mhtml
          echo "Done"
      
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
