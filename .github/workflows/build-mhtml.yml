name: 🗞️ Live News Builder (HTML)

on:
  workflow_dispatch:  # اجرای دستی
  schedule:
    - cron: '*/30 * * * *'  # هر 30 دقیقه یکبار

jobs:
  build-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # اجازه ذخیره خروجی در مخزن

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Create output directory
        run: mkdir -p output

      # ============================================================
      # 📰 1. دریافت اخبار از وب‌سایت‌ها (با متد ساده و قابل اعتماد)
      # ============================================================
      - name: 🌐 Fetch website headlines
        id: fetch_websites
        run: |
          # تابع استخراج عنوان از صفحه وب
          get_title() {
            url="$1"
            # با curl صفحه را گرفته، خط اول تایتل را با حذف تگ‌ها استخراج می‌کند
            curl -s -L --max-time 10 "$url" | grep -i -m1 '<title>' | sed 's/<[^>]*>//g' | sed 's/&nbsp;/ /g' | cut -c1-100
          }

          # لیست وبسایت‌ها (نام|آدرس)
          sites="Fox News|https://foxnews.com
          ABC News|https://abcnews.go.com
          CBS News|https://cbsnews.com
          The Jerusalem Post|https://jpost.com
          Iran International|https://iranintl.com"

          echo "NEWS_JSON='[" > news_data.json
          first=true
          while IFS='|' read -r name url; do
            echo "Fetching: $name"
            title=$(get_title "$url")
            if [ -n "$title" ]; then
              if [ "$first" = true ]; then first=false; else echo "," >> news_data.json; fi
              echo "{\"source\":\"$name\", \"title\":\"$title\", \"link\":\"$url\", \"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\"}" >> news_data.json
            else
              echo "  ⚠️ Failed to fetch: $name"
            fi
            sleep 1  # احترام به سرور
          done <<< "$sites"
          echo "]" >> news_data.json
          echo "✅ Website news saved."

      # ============================================================
      # 💬 2. دریافت پست‌های آخر کانال تلگرام (API عمومی)
      # ============================================================
      - name: 📡 Fetch Telegram channels
        id: fetch_telegram
        run: |
          # تابع دریافت آخرین پیام از کانال عمومی
          get_telegram_post() {
            channel="$1"
            # حذف @ از ابتدای نام کانال
            channel_clean="${channel#@}"
            # فراخوانی API عمومی برای دریافت آخرین پست
            api_url="https://tg.i-c-a.su/json/${channel_clean}/last"
            response=$(curl -s --max-time 10 "$api_url")
            # استخراج متن و لینک با jq (در ubuntu نصب است)
            text=$(echo "$response" | jq -r '.text // .caption // "متن موجود نیست"' | head -c 200)
            link="https://t.me/${channel_clean}"
            echo "{\"source\":\"$channel\", \"title\":\"$text\", \"link\":\"$link\", \"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\"}"
          }

          channels="@VahidOnline @alonews @IranintlTV"
          echo "TELEGRAM_JSON='[" > telegram_data.json
          first=true
          for ch in $channels; do
            echo "Fetching: $ch"
            post=$(get_telegram_post "$ch")
            if [ -n "$post" ] && [ "$post" != "null" ]; then
              if [ "$first" = true ]; then first=false; else echo "," >> telegram_data.json; fi
              echo "$post" >> telegram_data.json
            else
              echo "  ⚠️ Failed to fetch: $ch"
            fi
            sleep 1
          done
          echo "]" >> telegram_data.json
          echo "✅ Telegram posts saved."

      # ============================================================
      # 🎨 3. ساخت فایل HTML زیبا و واکنش‌گرا
      # ============================================================
      - name: 🏗️ Build HTML page
        run: |
          cat > output/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایش زنده اخبار | Live News Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2rem; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 0.9rem; }
        .update-time { background: #fee; color: #c00; text-align: center; padding: 8px; font-weight: bold; }
        .section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        .section h2 {
            color: #333;
            border-right: 5px solid #667eea;
            padding-right: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card-source {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 5px;
        }
        .card-title {
            font-size: 1rem;
            line-height: 1.4;
            margin: 10px 0;
        }
        .card-title a {
            color: #2c3e50;
            text-decoration: none;
        }
        .card-title a:hover { color: #667eea; text-decoration: underline; }
        .card-time {
            font-size: 0.7rem;
            color: #888;
            margin-top: 8px;
            text-align: left;
            direction: ltr;
        }
        .footer {
            background: #2d3748;
            color: #cbd5e0;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .news-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📡 پایشگر زنده اخبار جهان</h1>
        <p>اخبار لحظه‌ای از منابع معتبر و کانال‌های تلگرامی</p>
    </div>
    <div class="update-time" id="update-timestamp">
        🔄 زمان بروزرسانی: در حال دریافت...
    </div>

    <!-- وبسایت‌های خبری -->
    <div class="section">
        <h2>🌐 خبرگزاری‌های رسمی</h2>
        <div class="news-grid" id="websites-news">
            <!-- داده‌های وبسایت‌ها در اینجا درج می‌شوند -->
        </div>
    </div>

    <!-- کانال‌های تلگرام -->
    <div class="section">
        <h2>📱 کانال‌های تلگرامی</h2>
        <div class="news-grid" id="telegram-news">
            <!-- داده‌های تلگرام در اینجا درج می‌شوند -->
        </div>
    </div>
    <div class="footer">
        🤖 تولید شده توسط GitHub Actions | Live News Builder
    </div>
</div>

<script>
    // تابع کمکی برای ساخت کارت خبر
    function createCard(source, title, link, time) {
        return `
            <div class="card">
                <div class="card-source">
                    <span>📰 ${source}</span>
                </div>
                <div class="card-title">
                    <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
                </div>
                <div class="card-time">⏱️ ${time}</div>
            </div>
        `;
    }

    // بارگذاری داده‌های وبسایت‌ها
    try {
        const websiteData = __WEBSITES_JSON__;
        const websiteContainer = document.getElementById('websites-news');
        if(websiteContainer && websiteData.length) {
            websiteContainer.innerHTML = websiteData.map(item => createCard(item.source, item.title, item.link, item.time)).join('');
        }
    } catch(e) { console.warn("Error loading website news", e); }

    // بارگذاری داده‌های تلگرام
    try {
        const telegramData = __TELEGRAM_JSON__;
        const telegramContainer = document.getElementById('telegram-news');
        if(telegramContainer && telegramData.length) {
            telegramContainer.innerHTML = telegramData.map(item => createCard(item.source, item.title, item.link, item.time)).join('');
        }
    } catch(e) { console.warn("Error loading telegram news", e); }

    // نمایش زمان بروزرسانی
    const updateTimeDiv = document.getElementById('update-timestamp');
    if(updateTimeDiv) {
        updateTimeDiv.innerHTML = `🔄 آخرین بروزرسانی: ${new Date().toLocaleString('fa-IR')}`;
    }
</script>
</body>
</html>
HTMLEOF
          echo "✅ HTML template created."

      # ============================================================
      # 🔄 4. تزریق داده‌های JSON به فایل HTML
      # ============================================================
      - name: 💉 Inject live data into HTML
        run: |
          # خواندن داده‌های JSON
          WEBSITES_JSON=$(cat news_data.json | jq -c '.')
          TELEGRAM_JSON=$(cat telegram_data.json | jq -c '.')

          # جایگزینی در فایل HTML
          sed -i "s|__WEBSITES_JSON__|$WEBSITES_JSON|g" output/index.html
          sed -i "s|__TELEGRAM_JSON__|$TELEGRAM_JSON|g" output/index.html

          # حذف فایل‌های موقت
          rm news_data.json telegram_data.json
          echo "✅ Data injected into HTML."

      # ============================================================
      # 📦 5. ذخیره به عنوان MHTML (همان فایل HTML با پسوند .mhtml)
      # ============================================================
      - name: 📄 Save as MHTML
        run: cp output/index.html output/news.mhtml

      # ============================================================
      # 💾 6. آپلود آرتیفکت و Commit (اختیاری)
      # ============================================================
      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-news-page
          path: output/
          retention-days: 7

      - name: 🔁 Commit and push (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add output/news.mhtml output/index.html || true
          git diff --cached --quiet || git commit -m "📰 Auto-update news page [skip ci]" && git push
        continue-on-error: true
