name: M news
on:
  schedule:
    - cron: '*/30 0-11 * * *'
    - cron: '*/15 12-23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install html2mhtml
      - name: Create output directory
        run: mkdir -p output
      - name: Generate HTML from feeds
        run: python scraper.py
      - name: Convert HTML to MHTML
        run: html2mhtml output/index.html output/news.mhtml
      - name: Commit and Push the MHTML file
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/news.mhtml
          git diff --cached --quiet || git commit -m "Update news MHTML file [skip ci]"
          git push
