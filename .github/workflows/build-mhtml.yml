name: Live News Aggregator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p output

      - name: Fetch website headlines with debug
        run: |
          echo "=== DEBUG: Starting website fetch ==="
          
          get_title() {
            url="$1"
            echo "  Trying: $url" >&2
            curl -s -L --max-time 10 --user-agent "Mozilla/5.0" "$url" | grep -i -m1 '<title>' | sed 's/<[^>]*>//g' | cut -c1-100
          }
          
          echo '[' > websites.json
          first=true
          
          sites="Fox News|https://foxnews.com
          ABC News|https://abcnews.go.com
          CBS News|https://cbsnews.com"
          
          while IFS='|' read -r name url; do
            echo "Fetching: $name"
            title=$(get_title "$url")
            echo "  Got title: $title"
            if [ -n "$title" ]; then
              if [ "$first" = true ]; then first=false; else echo ',' >> websites.json; fi
              echo "{\"source\":\"$name\",\"title\":\"$title\",\"link\":\"$url\",\"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S')\"}" >> websites.json
            else
              echo "  ⚠️ No title found for $name"
            fi
            echo ""
            sleep 1
          done <<< "$sites"
          echo ']' >> websites.json
          
          echo "=== DEBUG: websites.json content ==="
          cat websites.json
          echo ""

      - name: Fetch Telegram channels with debug
        run: |
          echo "=== DEBUG: Starting Telegram fetch ==="
          
          get_telegram() {
            channel="$1"
            channel_clean="${channel#@}"
            api_url="https://tg.i-c-a.su/json/${channel_clean}/last"
            echo "  API URL: $api_url" >&2
            response=$(curl -s --max-time 10 "$api_url")
            echo "  Response length: ${#response}" >&2
            text=$(echo "$response" | jq -r '.text // .caption // "No content"' | head -c 150)
            echo "  Text: $text" >&2
            echo "{\"source\":\"$channel\",\"title\":\"$text\",\"link\":\"https://t.me/${channel_clean}\",\"time\":\"$(date -u +'%Y-%m-%d %H:%M:%S')\"}"
          }
          
          echo '[' > telegram.json
          first=true
          
          for ch in "@VahidOnline" "@alonews" "@IranintlTV"; do
            echo "Fetching: $ch"
            post=$(get_telegram "$ch")
            if [ -n "$post" ]; then
              if [ "$first" = true ]; then first=false; else echo ',' >> telegram.json; fi
              echo "$post" >> telegram.json
            fi
            sleep 1
          done
          echo ']' >> telegram.json
          
          echo "=== DEBUG: telegram.json content ==="
          cat telegram.json
          echo ""

      - name: Create HTML template
        run: |
          cat > output/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Live News Monitor</title>
          <style>
          body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px}
          .container{max-width:1200px;margin:0 auto;background:white;border-radius:10px}
          .header{background:#1a1a2e;color:white;padding:20px;text-align:center}
          .header h1{margin:0}
          .timebar{background:#2d3748;color:#e2e8f0;text-align:center;padding:10px}
          .section{padding:20px}
          .section h2{color:#333;margin-top:0}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px}
          .card{background:#f9f9f9;border-radius:8px;padding:15px;border:1px solid #ddd}
          .card-source{color:#667eea;font-weight:bold;font-size:12px}
          .card-title{margin:10px 0}
          .card-title a{color:#333;text-decoration:none}
          .card-title a:hover{color:#667eea}
          .card-time{color:#999;font-size:11px;text-align:right}
          .footer{background:#2d3748;color:#a0aec0;text-align:center;padding:15px;font-size:12px}
          @media (max-width:600px){body{padding:10px}.grid{grid-template-columns:1fr}}
          </style>
          </head>
          <body>
          <div class="container">
          <div class="header"><h1>📡 Live News Aggregator</h1><p>Real-time headlines from global media</p></div>
          <div class="timebar" id="timestamp">Loading...</div>
          <div class="section"><h2>🌐 News Websites</h2><div class="grid" id="websites-news"></div></div>
          <div class="section"><h2>📱 Telegram Channels</h2><div class="grid" id="telegram-news"></div></div>
          <div class="footer">Powered by GitHub Actions | Updates every 20 minutes</div>
          </div>
          <script src="data.js"></script>
          <script>
          function createCard(s,t,l,time){
            var safeTitle = (t || 'No title').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            return '<div class="card"><div class="card-source">📰 '+s+'</div><div class="card-title"><a href="'+l+'" target="_blank">'+safeTitle+'</a></div><div class="card-time">🕐 '+time+'</div></div>';
          }
          if(window.websiteData && window.websiteData.length){
            var html='';
            for(var i=0;i<window.websiteData.length;i++) html+=createCard(window.websiteData[i].source,window.websiteData[i].title,window.websiteData[i].link,window.websiteData[i].time);
            document.getElementById('websites-news').innerHTML=html;
          } else {
            document.getElementById('websites-news').innerHTML='<div class="card">No data from websites</div>';
          }
          if(window.telegramData && window.telegramData.length){
            var html='';
            for(var i=0;i<window.telegramData.length;i++) html+=createCard(window.telegramData[i].source,window.telegramData[i].title,window.telegramData[i].link,window.telegramData[i].time);
            document.getElementById('telegram-news').innerHTML=html;
          } else {
            document.getElementById('telegram-news').innerHTML='<div class="card">No data from Telegram</div>';
          }
          document.getElementById('timestamp').innerHTML='🔄 Last updated: '+new Date().toLocaleString();
          </script>
          </body>
          </html>
          HTML

      - name: Create JavaScript data file
        run: |
          echo "window.websiteData = $(cat websites.json);" > output/data.js
          echo "window.telegramData = $(cat telegram.json);" >> output/data.js
          echo "=== DEBUG: data.js content ==="
          cat output/data.js
          rm websites.json telegram.json

      - name: Save as MHTML
        run: cp output/index.html output/news.mhtml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-aggregator
          path: output/
          retention-days: 7
