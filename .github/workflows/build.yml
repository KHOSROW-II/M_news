name: build

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: stage
        shell: pwsh
        run: |
            New-Item -ItemType Directory -Force web | Out-Null
            New-Item -ItemType Directory -Force web\data | Out-Null
            New-Item -ItemType Directory -Force web\images | Out-Null
            Copy-Item index.html web\
            Copy-Item style.css web\
            Copy-Item script.js web\
            if (Test-Path output\news-data.json) { Copy-Item output\news-data.json web\data\ }
            if (Test-Path output\images) { Copy-Item output\images\* web\images\ -Recurse }

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: package
        run: |
          pyinstaller --onefile --console --name start `
            --add-data "web;web" `
            --collect-all webview `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import webview.platforms.winforms `
            start.py

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: start-exe
          path: dist/start.exe
          retention-days: 30