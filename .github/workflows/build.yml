name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'start.py'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $run = "${{ github.run_number }}"
          $version = "v$date.$run"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force web | Out-Null
          New-Item -ItemType Directory -Force web\data | Out-Null
          New-Item -ItemType Directory -Force web\images | Out-Null
          Copy-Item index.html web\
          Copy-Item style.css web\
          Copy-Item script.js web\

          if (Test-Path output\news-data.json) {
            Copy-Item output\news-data.json web\data\
          } else {
            '{"lastUpdated":null,"totalNews":0,"news":[],"stats":{}}' |
              Set-Content web\data\news-data.json -Encoding UTF8
          }

          if (Test-Path output\archive.json) {
            node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync('output/archive.json', 'utf8'));
              d.news = (d.news || []).slice(0, 100);
              d.totalNews = d.news.length;
              fs.writeFileSync('web/data/archive.json', JSON.stringify(d, null, 2));
            "
          } else {
            '{"news":[],"totalNews":0}' | Set-Content web\data\archive.json -Encoding UTF8
          }

          if (Test-Path output\images) {
            $keep = @()
            if (Test-Path web\data\news-data.json) {
              $cur = Get-Content web\data\news-data.json -Raw | ConvertFrom-Json
              foreach ($n in $cur.news) { if ($n.image) { $keep += ($n.image -split '/')[-1] } }
            }
            if (Test-Path web\data\archive.json) {
              $arch = Get-Content web\data\archive.json -Raw | ConvertFrom-Json
              foreach ($n in $arch.news) { if ($n.image) { $keep += ($n.image -split '/')[-1] } }
            }
            $keep = $keep | Select-Object -Unique
            foreach ($f in $keep) {
              $src = Join-Path output\images $f
              if (Test-Path $src) { Copy-Item $src web\images\ }
            }
          }

      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pillow

      - name: icon
        shell: pwsh
        run: |
          python -c "
import os
from PIL import Image, ImageDraw
os.makedirs('build', exist_ok=True)
img = Image.new('RGBA', (256, 256), (17, 24, 39, 255))
d = ImageDraw.Draw(img)
d.rectangle([48, 80, 208, 92], fill=(255, 255, 255, 255))
d.rectangle([48, 116, 208, 128], fill=(209, 213, 219, 255))
d.rectangle([48, 152, 168, 164], fill=(209, 213, 219, 255))
d.rectangle([48, 188, 188, 200], fill=(209, 213, 219, 255))
img.save('build/app.png')
img.save('build/app.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "

      - name: package
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name start `
            --icon "build\app.ico" `
            --add-data "web;web" `
            --collect-all webview `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import webview.platforms.winforms `
            start.py

      - name: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: start-exe-${{ steps.version.outputs.version }}
          path: dist/start.exe
          retention-days: 30

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}.

            **Download:** `start.exe` below.

            **Changes since previous release:** see commit history.
          files: dist/start.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true