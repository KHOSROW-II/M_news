name: Fetch and Update News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - name: Fetch news from sources
        run: node fetch-news.js
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news-data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update news $(date +'%Y-%m-%d %H:%M:%S')"
          git push
