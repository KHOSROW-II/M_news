name: news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: news-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install
        run: npm install --no-audit --no-fund

      - name: mkdir
        run: mkdir -p output/images

      - name: fetch
        run: node scripts/fetch-news.js
        timeout-minutes: 25

      - name: translate
        run: node scripts/translate-service.js
        timeout-minutes: 25
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          TRANSLATE_CONCURRENCY: '2'
        continue-on-error: true

      - name: fallback
        if: always()
        run: |
          if [ ! -f output/news-data.json ]; then
            if [ -f output/news-data-temp.json ]; then
              node -e '
                const fs=require("fs");
                const d=JSON.parse(fs.readFileSync("output/news-data-temp.json","utf8"));
                d.translationStats={totalTranslated:0,engine:"none",fallback:true};
                fs.writeFileSync("output/news-data.json",JSON.stringify(d,null,2));
              '
            else
              echo '{"lastUpdated":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","totalNews":0,"news":[],"stats":{},"translationStats":{"totalTranslated":0,"engine":"none","fallback":true}}' > output/news-data.json
            fi
          fi

      - name: report
        run: |
          T=$(jq '(.totalNews // (.news|length))' output/news-data.json 2>/dev/null || echo N/A)
          R=$(jq '.translationStats.totalTranslated // 0' output/news-data.json 2>/dev/null || echo N/A)
          F=$(jq '[.news[]|select(.translationError==true)]|length' output/news-data.json 2>/dev/null || echo N/A)
          A=$(jq '(.totalNews // 0)' output/archive.json 2>/dev/null || echo N/A)
          echo "## Report" >> $GITHUB_STEP_SUMMARY
          echo "| item | value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| current | $T |" >> $GITHUB_STEP_SUMMARY
          echo "| translated | $R |" >> $GITHUB_STEP_SUMMARY
          echo "| failed | $F |" >> $GITHUB_STEP_SUMMARY
          echo "| archive | $A |" >> $GITHUB_STEP_SUMMARY

      - name: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/news-data.json output/archive.json output/images/ || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Update news $(date '+%Y%m%d-%H%M%S')"
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              sleep 3
            done
          fi

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}
          path: output/
          retention-days: 3
