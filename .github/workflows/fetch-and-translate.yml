name: 📰 News Aggregator

on:
  schedule:
    - cron: '0 */2 * * *'  # هر 2 ساعت یکبار (کاهش مصرف)
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      
permissions:
  contents: write

jobs:
  aggregate-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Debug - List all files
        run: |
          pwd
          ls -la
          ls -la scripts/ || echo "scripts folder not found"
          find . -name "*.js" -type f
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # بدون کش کردن
      
      - name: 📦 Install dependencies (if any)
        run: |
          if [ -f "package.json" ]; then
            npm install --no-package-lock
          else
            echo "No dependencies needed"
          fi
      
      - name: 📁 Create output directory
        run: mkdir -p output
      
      - name: 🌐 Fetch news from all sources
        run: node scripts/fetch-news.js
        continue-on-error: false
      
      - name: 🤖 Translate to Persian
        run: node scripts/translate-service.js
        env:
          TRANSLATE_API_URL: "https://translate.argosopentech.com"
          TRANSLATE_CONCURRENCY: "2"
        continue-on-error: true  # اگر ترجمه failed باشه، کل workflow متوقف نشه
      
      - name: 📊 Generate report
        run: |
          if [ -f "output/news-data.json" ]; then
            echo "## 📊 News Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total News | $(jq '.totalNews // .news | length' output/news-data.json 2>/dev/null || echo 'N/A') |" >> $GITHUB_STEP_SUMMARY
            echo "| Last Updated | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 💾 Save and commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/news-data.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update news $(date '+%Y%m%d-%H%M%S')"
            git push
          fi
      
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-data-$(date '+%Y%m%d-%H%M%S')
          path: output/
          retention-days: 3
