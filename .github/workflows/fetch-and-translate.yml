name: 📰 News Aggregator with Real Translation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-translate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🗑️ Clean Old Output (Optional)
        run: |
          mkdir -p output
          rm -f output/news-data.json
      
      - name: 🌐 Fetch News from All Sources
        run: node scripts/fetch-news.js
        env:
          NODE_NO_WARNINGS: 1
      
      - name: 🤖 Translate Non-Persian Content
        run: node scripts/translate-service.js
        env:
          TRANSLATE_API_URL: "https://translate.argosopentech.com"
          TRANSLATE_CONCURRENCY: "3"
      
      - name: 📊 Generate Statistics
        run: |
          echo "## 📊 گزارش خبرهای $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| معیار | مقدار |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| کل اخبار | $(jq '.news | length' output/news-data.json) |" >> $GITHUB_STEP_SUMMARY
          echo "| اخبار ترجمه شده | $(jq '[.news[] | select(.translated == true)] | length' output/news-data.json) |" >> $GITHUB_STEP_SUMMARY
          echo "| زبان‌های مبدأ | $(jq '[.news[].originalLang] | unique | join(", ")' output/news-data.json) |" >> $GITHUB_STEP_SUMMARY
      
      - name: 💾 Commit and Push Results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add output/news-data.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update news $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        continue-on-error: true
      
      - name: ✅ Upload Artifact (برای مشاهده آنی)
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: output/news-data.json
          retention-days: 7
