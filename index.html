<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 خبرخوان خودکار | ترجمه هوشمند</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>📡 خبرخوان چندمنبعی</h1>
            <p>جمع‌آوری خودکار از ۳ منبع + ترجمه واقعی غیرفارسی</p>
            <div class="status" id="status"></div>
        </header>
        
        <div class="controls">
            <input type="text" id="search" placeholder="جستجو در اخبار..." class="search-input">
            <div class="filters" id="filters"></div>
        </div>
        
        <div class="news-container" id="newsContainer">
            <div class="loading">در حال بارگذاری...</div>
        </div>
        
        <footer>
            <p>⚠️ اخبار با 🌐 مشخص شده‌اند با <strong>ترجمه ماشینی</strong> برگردانده شده‌اند</p>
            <p>منابع: C14 (عبری) | ایران اینترنشنال (فارسی) | رضا پهلوی (انگلیسی)</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
