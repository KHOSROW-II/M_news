<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="topbar">
            <div class="brand">News</div>
            <div class="topbar-actions">
                <input type="text" id="search" class="search" placeholder="Search...">
                <button id="langBtn" class="btn" type="button">Original</button>
                <button id="refreshBtn" class="btn" type="button">Refresh</button>
            </div>
        </div>

        <div class="filters" id="filters"></div>

        <main class="main">
            <div class="grid" id="grid">
                <div class="loading">Loading...</div>
            </div>
        </main>
    </div>

    <div id="reader" class="reader" hidden>
        <div class="reader-window">
            <button class="reader-close" id="readerClose" type="button">&times;</button>
            <div id="readerContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
